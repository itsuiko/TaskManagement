# テストのときだけ上書きする設定。
#
# src/main/resources/application.properties を読んだ上で、ここに書いた項目だけが
# 差し替わる。test 側に application.properties（プロファイル無しの同名ファイル）を
# 置くとクラスパスの先勝ちで main 側が丸ごと読まれなくなり、
# データベースの接続先まで書き写すことになるので、この形にしている。

# data.sql を実行しない。
#
# テストは本番と同じ task_management データベースに繋いでいるため、
# 既定（always）のままだと gradlew test のたびに data.sql の
# DELETE FROM tasks が走り、API から登録したタスクが全部消える。
# テストが本番のデータを消してしまうのを止めるための1行。
spring.sql.init.mode=never
