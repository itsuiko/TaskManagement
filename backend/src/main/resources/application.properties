spring.application.name=TaskManagement

# compose.yaml の db サービスに繋ぐ。ホスト側の 127.0.0.1:5432 に公開してある。
spring.datasource.url=jdbc:postgresql://localhost:5432/task_management
spring.datasource.username=taskuser
spring.datasource.password=taskpass

# エンティティの定義に合わせてテーブルを作る／足りない列を足す。
# 本番では使わない（列の削除や型変更を検知しないため）。理由は docs/tech-stack.md に記載。
spring.jpa.hibernate.ddl-auto=update

# 画面を描き終わるまで DB 接続を握り続ける既定の挙動を切る。Boot が既定値のままだと警告を出す。
spring.jpa.open-in-view=false

# 起動時に Hibernate が発行する CREATE TABLE 文をログで確認するため。
spring.jpa.show-sql=true

# data.sql を起動時に実行する。既定値は always ではなく embedded で、
# H2 のような組み込みデータベースのときしか動かない。PostgreSQL は組み込みではないので、
# 既定のままだと data.sql が黙って無視される。
spring.sql.init.mode=always

# data.sql の実行を、Hibernate がテーブルを作り終えた後まで遅らせる。
# 「初期化」という語が入っているがデータを消す設定ではなく、実行順序の指定。
# false（既定）のままだと、空のデータベースから起動したときに
# テーブルが存在しない状態で data.sql が走って起動に失敗する。
spring.jpa.defer-datasource-initialization=true
