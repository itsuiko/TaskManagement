spring.application.name=TaskManagement

# compose.yaml の db サービスに繋ぐ。ホスト側の 127.0.0.1:5432 に公開してある。
spring.datasource.url=jdbc:postgresql://localhost:5432/task_management
spring.datasource.username=taskuser
spring.datasource.password=taskpass

# エンティティの定義に合わせてテーブルを作る／足りない列を足す。
# 本番では使わない（列の削除や型変更を検知しないため）。理由は docs/tech-stack.md に記載。
spring.jpa.hibernate.ddl-auto=update

# 画面を描き終わるまで DB 接続を握り続ける既定の挙動を切る。Boot が既定値のままだと警告を出す。
spring.jpa.open-in-view=false

# 起動時に Hibernate が発行する CREATE TABLE 文をログで確認するため。
spring.jpa.show-sql=true
