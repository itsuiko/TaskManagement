services:
  db:
    image: postgres:18
    container_name: taskmanagement-db
    environment:
      POSTGRES_DB: task_management
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
    ports:
      # 127.0.0.1 を付けて localhost からだけ届くようにする。
      # "5432:5432" と書くと同一ネットワークの他端末からも見える。
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 以降は /var/lib/postgresql に1つだけマウントする。
      # 17 までの書き方 /var/lib/postgresql/data だと、18 は起動せず終了コード1で落ちる
      # （18 はデータをメジャーバージョン別のディレクトリ 18/docker に置くようになったため）。
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d task_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
