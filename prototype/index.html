<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskManagement — プロトタイプ</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7;
    --panel: #ebecf0;
    --card: #ffffff;
    --text: #172b4d;
    --muted: #6b778c;
    --line: #dfe1e6;
    --accent: #0052cc;
    --danger: #de350b;
    --high: #de350b;
    --medium: #ff991f;
    --low: #0065ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }

  header.app-header {
    background: #ffffff;
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  header.app-header h1 { font-size: 18px; margin: 0; }
  .note { color: var(--muted); font-size: 12px; }

  /* ---------- S-01 ボード画面 ---------- */
  .board {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    padding: 20px;
    overflow-x: auto;
  }

  .column {
    background: var(--panel);
    border: 2px solid transparent;
    border-radius: 8px;
    width: 300px;
    flex: 0 0 300px;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 130px);
  }
  .column.drag-over {
    border-color: var(--accent);
    background: #e4ecfb;
  }

  .column-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    font-weight: 600;
  }
  .count {
    color: var(--muted);
    font-weight: 400;
    font-size: 12px;
  }

  .card-list {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 0 8px 4px;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card {
    background: var(--card);
    border-radius: 6px;
    box-shadow: 0 1px 1px rgba(9, 30, 66, .25);
    padding: 8px 10px;
    cursor: grab;
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card.dragging { opacity: .4; cursor: grabbing; }
  .card-title { margin: 0; word-break: break-word; }
  .card-meta {
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .badge {
    color: #fff;
    border-radius: 3px;
    padding: 0 6px;
    font-size: 11px;
    line-height: 18px;
  }
  .badge.high { background: var(--high); }
  .badge.medium { background: var(--medium); }
  .badge.low { background: var(--low); }

  .add-btn {
    margin: 4px 8px 8px;
    padding: 8px 10px;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--muted);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .add-btn:hover { background: rgba(9, 30, 66, .08); color: var(--text); }

  /* ---------- S-02 / S-03 / S-04 ---------- */
  dialog {
    border: none;
    border-radius: 8px;
    padding: 0;
    width: min(440px, 92vw);
    box-shadow: 0 8px 24px rgba(9, 30, 66, .3);
    color: var(--text);
  }
  dialog::backdrop { background: rgba(9, 30, 66, .5); }

  .dialog-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .dialog-head h2 { font-size: 16px; margin: 0; }
  .icon-btn {
    border: none;
    background: transparent;
    font-size: 20px;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
  }

  .dialog-body { padding: 16px; }
  .dialog-body label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .dialog-body input,
  .dialog-body textarea,
  .dialog-body select {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
    background: #fafbfc;
  }
  .dialog-body input:focus,
  .dialog-body textarea:focus,
  .dialog-body select:focus {
    background: #fff;
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .dialog-body textarea { resize: vertical; }
  .field + .field { margin-top: 12px; }
  .req { color: var(--danger); }
  .row { display: flex; gap: 12px; }
  .row > .field { flex: 1; margin-top: 12px; }
  .error {
    margin: 4px 0 0;
    color: var(--danger);
    font-size: 12px;
  }
  input.invalid { border-color: var(--danger); }

  .dialog-foot {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
  }
  .spacer { flex: 1; }
  .btn {
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    font: inherit;
    cursor: pointer;
  }
  .btn:hover { background: #f1f2f4; }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn.primary:hover { background: #0047b3; }
  .btn.danger {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  .btn.danger:hover { background: #bf2600; }
  .btn.danger-text { border-color: transparent; color: var(--danger); }

  .confirm-body { padding: 16px; }
  .confirm-body h2 { font-size: 16px; margin: 0 0 12px; }
  .confirm-title {
    margin: 0;
    padding: 10px 12px;
    background: var(--panel);
    border-radius: 4px;
    word-break: break-word;
  }
</style>
</head>
<body>

<header class="app-header">
  <h1>TaskManagement</h1>
  <span class="note">プロトタイプ（モック）：データは保存されません。再読み込みで初期状態に戻ります。</span>
</header>

<main class="board" id="board"></main>

<!-- S-02 / S-03 タスク作成・編集モーダル -->
<dialog id="task-dialog">
  <form id="task-form">
    <div class="dialog-head">
      <h2 id="task-dialog-title">タスクを追加</h2>
      <button type="button" class="icon-btn" id="btn-close" aria-label="閉じる">&times;</button>
    </div>
    <div class="dialog-body">
      <div class="field">
        <label for="f-title">タイトル <span class="req">＊</span></label>
        <input type="text" id="f-title" maxlength="100" autocomplete="off">
        <p class="error" id="f-title-error" role="alert" hidden>タイトルを入力してください。</p>
      </div>
      <div class="field">
        <label for="f-description">説明文</label>
        <textarea id="f-description" rows="3"></textarea>
      </div>
      <div class="row">
        <div class="field">
          <label for="f-due-date">期限</label>
          <input type="date" id="f-due-date">
        </div>
        <div class="field">
          <label for="f-priority">優先度</label>
          <select id="f-priority">
            <option value="">未指定</option>
            <option value="high">高</option>
            <option value="medium">中</option>
            <option value="low">低</option>
          </select>
        </div>
      </div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn danger-text" id="btn-delete" hidden>削除</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="btn-cancel">キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<!-- S-04 削除確認ダイアログ -->
<dialog id="confirm-dialog">
  <div class="confirm-body">
    <h2>このタスクを削除しますか？</h2>
    <p class="confirm-title" id="confirm-target"></p>
  </div>
  <div class="dialog-foot">
    <span class="spacer"></span>
    <button type="button" class="btn" id="btn-confirm-cancel">やめる</button>
    <button type="button" class="btn danger" id="btn-confirm-ok">削除する</button>
  </div>
</dialog>

<script>
'use strict';

// ---------------------------------------------------------------------------
// データ（メモリ上のみ。バックエンドもデータベースも無いので保存されない）
// カラム名は docs/data-design.md のテーブル定義に合わせている
// ---------------------------------------------------------------------------
const STATUSES = [
  { key: 'todo',  label: '未着手' },
  { key: 'doing', label: '作業中' },
  { key: 'done',  label: '完了'   }
];
const PRIORITY_LABELS = { high: '高', medium: '中', low: '低' };

let tasks = [
  { id: 1, title: '要件定義書を5文書に分割する', description: '1ファイルに全部入りだと探せない', due_date: '2026-09-03', priority: 'high',   status: 'done',  sort_order: 0 },
  { id: 2, title: 'コマンド実行の許可設定',       description: '',                                 due_date: '',           priority: 'low',    status: 'done',  sort_order: 1 },
  { id: 3, title: 'プロトタイプを作る',           description: 'HTML / CSS / JavaScript のみ',     due_date: '2026-09-05', priority: 'high',   status: 'doing', sort_order: 0 },
  { id: 4, title: '技術スタックを決める',         description: '3層構成・Web API・D&D が書けること', due_date: '',         priority: 'medium', status: 'todo',  sort_order: 0 },
  { id: 5, title: 'バックエンドの雛形を作る',     description: '',                                 due_date: '2026-09-10', priority: 'medium', status: 'todo',  sort_order: 1 },
  { id: 6, title: 'データベースを用意する',       description: 'tasks テーブル1つのみ',            due_date: '',           priority: '',       status: 'todo',  sort_order: 2 }
];
let nextId = 7;

// 編集中のタスクID。null なら新規作成
let editingId = null;
// 新規作成時に追加する列
let creatingStatus = 'todo';
// 削除確認の対象
let deletingId = null;

const board = document.getElementById('board');
const taskDialog = document.getElementById('task-dialog');
const confirmDialog = document.getElementById('confirm-dialog');
const form = document.getElementById('task-form');
const fTitle = document.getElementById('f-title');
const fTitleError = document.getElementById('f-title-error');
const fDescription = document.getElementById('f-description');
const fDueDate = document.getElementById('f-due-date');
const fPriority = document.getElementById('f-priority');
const btnDelete = document.getElementById('btn-delete');

// ---------------------------------------------------------------------------
// 描画（F-01 / F-08）
// ---------------------------------------------------------------------------
function tasksOf(status) {
  return tasks
    .filter(task => task.status === status)
    .sort((a, b) => a.sort_order - b.sort_order);
}

function formatDate(value) {
  return value ? value.replace(/-/g, '/') : '';
}

function createCard(task) {
  const card = document.createElement('article');
  card.className = 'card';
  card.draggable = true;
  card.dataset.id = String(task.id);
  card.tabIndex = 0;

  const title = document.createElement('p');
  title.className = 'card-title';
  title.textContent = task.title;
  card.appendChild(title);

  if (task.priority || task.due_date) {
    const meta = document.createElement('div');
    meta.className = 'card-meta';

    if (task.priority) {
      const badge = document.createElement('span');
      badge.className = 'badge ' + task.priority;
      badge.textContent = PRIORITY_LABELS[task.priority];
      meta.appendChild(badge);
    }
    if (task.due_date) {
      const due = document.createElement('span');
      due.className = 'due';
      due.textContent = formatDate(task.due_date);
      meta.appendChild(due);
    }
    card.appendChild(meta);
  }

  card.addEventListener('click', () => openEditDialog(task.id));
  card.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      openEditDialog(task.id);
    }
  });
  card.addEventListener('dragstart', event => {
    event.dataTransfer.effectAllowed = 'move';
    // Firefox はデータが入っていないとドラッグを始めないため、IDを入れておく
    event.dataTransfer.setData('text/plain', String(task.id));
    // 見た目の変更をこの場でやるとドラッグ中の半透明画像まで薄くなるので、1拍ずらす
    setTimeout(() => card.classList.add('dragging'), 0);
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    document.querySelectorAll('.column.drag-over')
      .forEach(column => column.classList.remove('drag-over'));
    render();
  });

  return card;
}

function createColumn(status) {
  const items = tasksOf(status.key);

  const column = document.createElement('section');
  column.className = 'column';
  column.dataset.status = status.key;

  const head = document.createElement('div');
  head.className = 'column-head';
  const name = document.createElement('span');
  name.textContent = status.label;
  const count = document.createElement('span');
  count.className = 'count';
  count.textContent = '(' + items.length + ')';
  head.append(name, count);

  const list = document.createElement('div');
  list.className = 'card-list';
  items.forEach(task => list.appendChild(createCard(task)));

  const addButton = document.createElement('button');
  addButton.type = 'button';
  addButton.className = 'add-btn';
  addButton.textContent = '＋ カードを追加';
  addButton.addEventListener('click', () => openCreateDialog(status.key));

  column.append(head, list, addButton);
  enableDrop(column, list);
  return column;
}

function render() {
  board.textContent = '';
  STATUSES.forEach(status => board.appendChild(createColumn(status)));
}

// ---------------------------------------------------------------------------
// ドラッグ＆ドロップ（F-05 列をまたぐ移動 / F-06 同じ列の中での並び替え）
// ---------------------------------------------------------------------------

// 掴んでいるカードを、リスト内のどのカードの手前に置くかを求める。
// 各カードの上下中央より上にポインタがあれば、そのカードの手前が挿入位置。
function findInsertBefore(list, pointerY) {
  const cards = [...list.querySelectorAll('.card:not(.dragging)')];
  return cards.find(card => {
    const box = card.getBoundingClientRect();
    return pointerY < box.top + box.height / 2;
  }) || null;
}

function enableDrop(column, list) {
  column.addEventListener('dragover', event => {
    const dragging = document.querySelector('.card.dragging');
    if (!dragging) return;
    event.preventDefault();
    column.classList.add('drag-over');

    // 掴んでいるカードそのものを動かして、落ちる位置をその場で見せる
    const before = findInsertBefore(list, event.clientY);
    if (before) {
      list.insertBefore(dragging, before);
    } else {
      list.appendChild(dragging);
    }
  });

  column.addEventListener('dragleave', event => {
    if (!column.contains(event.relatedTarget)) {
      column.classList.remove('drag-over');
    }
  });

  column.addEventListener('drop', event => {
    event.preventDefault();
    column.classList.remove('drag-over');
    commitOrderFromScreen();
  });
}

// 画面上の並びを、そのまま status と sort_order に書き戻す
function commitOrderFromScreen() {
  document.querySelectorAll('.column').forEach(column => {
    const status = column.dataset.status;
    [...column.querySelectorAll('.card')].forEach((card, index) => {
      const task = tasks.find(item => item.id === Number(card.dataset.id));
      if (task) {
        task.status = status;
        task.sort_order = index;
      }
    });
  });
}

// ---------------------------------------------------------------------------
// 作成・編集モーダル（S-02 / S-03、F-02 / F-03）
// ---------------------------------------------------------------------------
function clearError() {
  fTitleError.hidden = true;
  fTitle.classList.remove('invalid');
}

function openCreateDialog(status) {
  editingId = null;
  creatingStatus = status;
  document.getElementById('task-dialog-title').textContent = 'タスクを追加';
  btnDelete.hidden = true;
  form.reset();
  clearError();
  taskDialog.showModal();
  fTitle.focus();
}

function openEditDialog(id) {
  const task = tasks.find(item => item.id === id);
  if (!task) return;

  editingId = id;
  document.getElementById('task-dialog-title').textContent = 'タスクを編集';
  btnDelete.hidden = false;
  fTitle.value = task.title;
  fDescription.value = task.description;
  fDueDate.value = task.due_date;
  fPriority.value = task.priority;
  clearError();
  taskDialog.showModal();
  fTitle.focus();
}

form.addEventListener('submit', event => {
  event.preventDefault();
  const title = fTitle.value.trim();

  // タイトルが空なら保存せずエラーを表示し、モーダルは閉じない
  if (title === '') {
    fTitleError.hidden = false;
    fTitle.classList.add('invalid');
    fTitle.focus();
    return;
  }

  const values = {
    title: title,
    description: fDescription.value.trim(),
    due_date: fDueDate.value,
    priority: fPriority.value
  };

  if (editingId === null) {
    // 新しいカードはその列の末尾に追加する
    tasks.push(Object.assign({
      id: nextId++,
      status: creatingStatus,
      sort_order: tasksOf(creatingStatus).length
    }, values));
  } else {
    Object.assign(tasks.find(item => item.id === editingId), values);
  }

  taskDialog.close();
  render();
});

document.getElementById('btn-cancel').addEventListener('click', () => taskDialog.close());
document.getElementById('btn-close').addEventListener('click', () => taskDialog.close());
fTitle.addEventListener('input', clearError);

// ---------------------------------------------------------------------------
// 削除（S-04、F-04）
// ---------------------------------------------------------------------------
btnDelete.addEventListener('click', () => {
  const task = tasks.find(item => item.id === editingId);
  if (!task) return;
  deletingId = task.id;
  document.getElementById('confirm-target').textContent = '「' + task.title + '」';
  taskDialog.close();
  confirmDialog.showModal();
});

document.getElementById('btn-confirm-cancel').addEventListener('click', () => {
  deletingId = null;
  confirmDialog.close();
});

document.getElementById('btn-confirm-ok').addEventListener('click', () => {
  tasks = tasks.filter(item => item.id !== deletingId);
  deletingId = null;
  confirmDialog.close();
  render();
});

render();
</script>
</body>
</html>
